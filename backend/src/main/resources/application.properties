spring.application.name=civicconnect

# MySQL configuration
# Locally, the defaults use MySQL on localhost.
# On Render, set DB_URL, DB_USER, and DB_PASS in the service environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/localresolve?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Local defaults to 8080; Render provides PORT at runtime.
server.port=${PORT:8080}

# Set JWT_SECRET in production. The fallback is only for local development.
jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-before-deployment}
jwt.expiration=86400000

# CORS: configure this to the exact deployed Vercel URL in Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.localresolve=INFO
logging.level.org.springframework.security=INFO
